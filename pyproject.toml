[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thread-knowledge"
version = "0.3.0"
description = "Local-first threaded discussion retrieval, OCR enrichment, and MCP access"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0,<3",
  "httpx>=0.27,<1",
  "opensearch-py>=3,<4",
]

[project.optional-dependencies]
ocr = [
  "docling>=2,<3",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
]

[project.scripts]
thread-knowledge = "thread_knowledge.cli:main"
thread-knowledge-mcp = "thread_knowledge.mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
